name: Build Addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check_version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version consistency
        run: bash .github/workflows/check_version.sh "$GITHUB_REF_NAME"

  build:
    runs-on: ubuntu-latest
    needs: check_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload to CurseForge and Wago
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
